name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Lint, types, tests et compilation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gestvente
          POSTGRES_PASSWORD: gestvente_ci
          POSTGRES_DB: gestvente
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U gestvente -d gestvente"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gestvente:gestvente_ci@localhost:5434/gestvente?schema=public
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-secret-de-test-uniquement-pas-pour-la-production-0123456789
      STOCKAGE_DIR: stockage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Dépendances
        run: pnpm install --frozen-lockfile
      - name: Code partagé
        run: pnpm --filter @gestvente/commun build
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      - name: Tests unitaires
        run: pnpm test
      - name: Migrations
        run: pnpm --filter @gestvente/api db:deploy
      - name: Tests de bout en bout (API)
        run: pnpm --filter @gestvente/api test:e2e
      - name: Compilation de l'API
        run: pnpm --filter @gestvente/api build
      - name: Export web de l'application
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: /api
          CI: 1
        run: npx expo export --platform web --output-dir dist-web

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: verifications
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: API
        run: docker build -f deploy/api.Dockerfile -t gestvente-api .
      - name: Site et Caddy
        run: docker build -f deploy/web.Dockerfile -t gestvente-web .
      - name: Caddyfile
        run: docker run --rm -e DOMAINE=exemple.com -e ACME_EMAIL=a@exemple.com gestvente-web caddy validate --config /etc/caddy/Caddyfile
